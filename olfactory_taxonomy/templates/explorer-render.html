<!doctype html><meta charset="utf-8"><title>Prepare explorer tiles</title><style>body{font:16px system-ui;margin:40px}button{padding:12px;margin:8px}canvas{display:none}</style><h1>Prepare explorer tiles</h1><p>Render the selected SVG once at native resolution with the browser's fonts and filters.</p><button id="labels">Render labelled PNG</button><button id="image">Render image-only PNG</button><p id="state">Ready</p><script>
for(const mode of ['labels','image'])document.getElementById(mode).onclick=async()=>{const status=document.getElementById('state');try{status.textContent='Loading '+mode;const response=await fetch(mode==='labels'?'embedded.svg':'embedded-image.svg',{cache:'no-store'}),blob=await response.blob(),url=URL.createObjectURL(blob),img=new Image();img.src=url;await img.decode();status.textContent='Rendering '+mode;await new Promise(requestAnimationFrame);const c=document.createElement('canvas');c.width=c.height=6144;const ctx=c.getContext('2d');ctx.fillStyle='#f7f5ef';ctx.fillRect(0,0,6144,6144);ctx.drawImage(img,0,0);const png=await new Promise(resolve=>c.toBlob(resolve,'image/png'));const out=URL.createObjectURL(png),a=document.createElement('a');a.href=out;a.download=mode+'.png';a.click();status.textContent='Saved '+mode+' PNG';URL.revokeObjectURL(url);setTimeout(()=>URL.revokeObjectURL(out),60000)}catch(e){status.textContent=e.message}};
</script>
